name: Music Center tests
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'scripts/**'
      - 'src/web.js'
      - 'src/dashboard.js'
      - 'index.js'
      - 'test/**'
      - 'web/**'
      - '.github/workflows/music-center.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: (command -v ffmpeg && command -v ffprobe) || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Verify the Railway image and its runtime dependencies
        run: docker build --tag timmy-runtime-check .
